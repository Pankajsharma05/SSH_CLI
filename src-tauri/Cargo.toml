[package]
name = "ssh_cli"
version = "1.0.0"
edition = "2021"
authors = ["Pankaj Sharma"]
description = "SSH_CLI — dual-pane SSH file manager with remote and local terminals, built for cluster work"
readme = "../README.md"
license = "MIT"
keywords = ["ssh", "scp", "hpc", "slurm", "terminal"]
categories = ["command-line-utilities", "filesystem"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
portable-pty = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
