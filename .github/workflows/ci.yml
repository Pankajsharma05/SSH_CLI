name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ./build_linux.sh --deps

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Both scripts vendor xterm.js/CodeMirror/fonts, then cargo build.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: ./build_linux.sh

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: ./build_mac.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: .\build_windows.ps1
        shell: pwsh

      # Uploaded before the lint step so a style nit never costs you the
      # binary. Download it from the run's Artifacts section.
      - name: Upload the Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ssh_cli-windows-x86_64
          path: dist/ssh_cli.exe
          if-no-files-found: error

      # A debug build keeps the console subsystem (the release attribute
      # is cfg'd on not(debug_assertions)), so running this one from
      # PowerShell prints Rust panics and backtraces that the windowed
      # build swallows. Diagnostics only — it is slower and unoptimised.
      - name: Build a console/debug exe for diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_BACKTRACE: "1"
        run: |
          Push-Location src-tauri
          cargo build
          Pop-Location
          Copy-Item src-tauri\target\debug\ssh_cli.exe dist\ssh_cli-debug.exe

      - name: Upload the diagnostic exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ssh_cli-windows-debug
          path: dist/ssh_cli-debug.exe
          if-no-files-found: error

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Check the binary is complete
        if: runner.os == 'Linux'
        run: |
          test -x dist/ssh_cli
          ldd dist/ssh_cli | (! grep 'not found')
