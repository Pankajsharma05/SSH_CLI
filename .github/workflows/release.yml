name: Release

# Tag a release and this builds the artifacts and attaches them:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: ./build_linux.sh --deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build binary + .deb
        run: ./build_linux.sh --deb
      - name: Name the artifacts
        run: |
          mkdir -p out
          cp dist/ssh_cli out/ssh_cli-linux-x86_64
          cp dist/*.deb out/
          (cd out && sha256sum * > SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build universal .app + .dmg
        # NOTE: the app is only ad-hoc signed and is NOT notarized.
        # See docs/SIGNING.md before distributing this widely.
        run: ./build_mac.sh --universal --dmg
      - name: Name the artifacts
        run: |
          mkdir -p out
          cp dist/SSH_CLI.dmg out/SSH_CLI-macos-universal.dmg
          (cd out && shasum -a 256 * > SHA256SUMS-macos.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build exe + NSIS installer
        # NOTE: unsigned. SmartScreen will warn on first run.
        # See docs/SIGNING.md.
        run: .\build_windows.ps1 -Installer
        shell: pwsh
      - name: Name the artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item dist\ssh_cli.exe out\ssh_cli-windows-x86_64.exe
          Get-ChildItem dist\*setup.exe | ForEach-Object { Copy-Item $_.FullName out\ }
          Get-FileHash out\* -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content out\SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  publish:
    name: Publish the release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](CHANGELOG.md) for what changed.

            **These binaries are not code-signed or notarized.**
            On macOS: right-click the app → Open → Open (once), or
            `xattr -dr com.apple.quarantine /Applications/SSH_CLI.app`.
            On Windows: SmartScreen shows "Windows protected your PC" →
            More info → Run anyway. Windows users should also read
            [docs/WINDOWS.md](docs/WINDOWS.md) — the file panes need an
            SSH key, because Windows OpenSSH cannot share a connection.
            Details and the reasoning: [docs/SIGNING.md](docs/SIGNING.md).
            If you would rather not trust an unsigned download, building from
            source takes one command.
